# Example: drop this into your own repo as .github/workflows/explainer.yml
name: PR Explainer

on:
  pull_request:
    types: [closed]

jobs:
  explainer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: shilpi1958/code-explainer@v1
        with:
          # generate locally with: claude setup-token
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # optional — product analytics + AI evals
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
          posthog-host: ${{ secrets.POSTHOG_HOST }}
