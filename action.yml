name: "PR Explainer"
description: "Generates a personalized explainer for a merged PR and commits it."
author: "shilpi1958"
branding:
  icon: "book-open"
  color: "purple"

inputs:
  claude-code-oauth-token:
    description: >
      Long-lived token from a Claude subscription, created locally with
      `claude setup-token` and stored as a repo secret. Preferred — no
      separate API billing. Provide this or anthropic-api-key.
    required: false
  anthropic-api-key:
    description: "Anthropic Console API key. Used only if claude-code-oauth-token is not set."
    required: false
  profile-path:
    description: "Path to the learning profile file"
    required: false
    default: "learning-profile.md"
  output-dir:
    description: "Directory to write explainers into"
    required: false
    default: "docs/explainers"
  commit:
    description: "If true, commits and pushes the generated entry directly to the merge commit's branch"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install pr-explainer and Claude Code CLI
      shell: bash
      run: |
        npm install --no-save @shilpi1958/pr-explainer @anthropic-ai/claude-code

    - name: Generate explainer
      id: generate
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        LEARNING_PROFILE: ${{ inputs.profile-path }}
        EXPLAINER_DIR: ${{ inputs.output-dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        OUT_PATH=$(npx pr-explainer "${{ github.event.pull_request.number }}")
        echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"

    - name: Commit entry
      if: ${{ inputs.commit == 'true' }}
      shell: bash
      run: |
        git config user.name "pr-explainer[bot]"
        git config user.email "actions@github.com"
        git add "${{ steps.generate.outputs.path }}" "$(dirname "${{ steps.generate.outputs.path }}")/index.md"
        git commit -m "docs: explainer for #${{ github.event.pull_request.number }}"
        git push
